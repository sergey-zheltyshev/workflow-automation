[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autohunt-2"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2,<3", "playwright>=1.47,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
live = ["playwright>=1.47"]

[project.scripts]
autohunt = "autohunt.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
